# ============================================================================
# v25 优化6：Gradle Version Catalog（依赖版本统一管理）
# ============================================================================
#
# 设计目的：
# - 将分散在 build.gradle.kts 各处的依赖版本号集中到本文件统一管理
# - 后续升级依赖时只需修改本文件一处，避免版本冲突与遗漏
# - 标准的 Gradle Version Catalog 机制，无需额外插件支持
#
# 使用方式：
# - 在 build.gradle.kts 中用 libs.xxx 引用（如 libs.androidx.core.ktx）
# - 版本号通过 [versions] 段统一定义，避免重复字符串散落
# - 库坐标通过 [libraries] 段映射，插件通过 [plugins] 段映射
# ============================================================================

[versions]
# === Gradle 插件版本 ===
agp = "9.3.1"                          # Android Gradle Plugin
kotlin = "2.2.10"                      # Kotlin 编译器（与 Compose Compiler 同步）
ksp = "2.3.2"                          # Kotlin Symbol Processing（Room 编译期代码生成）

# === AndroidX Core ===
coreKtx = "1.15.0"                     # AndroidX Core KTX
lifecycle = "2.8.7"                    # Lifecycle (runtime-ktx / viewmodel-compose / process)
activityCompose = "1.9.3"              # Activity Compose 集成
navigationCompose = "2.8.5"            # Navigation Compose

# === Compose ===
composeBom = "2024.12.01"              # Compose BOM（统一管理 Compose 各库版本）

# === Room 数据库 ===
room = "2.7.1"                         # Room（原生支持 KSP2，解决 Kotlin 2.2.10 兼容性）

# === Paging 3 ===
paging = "3.3.5"                       # Paging (runtime-ktx / compose)

# === 数据存储 ===
datastorePreferences = "1.1.1"         # DataStore Preferences

# === Apache POI（Excel 导入导出）===
poi = "5.3.0"                          # Apache POI + POI-OOXML

# === 文件选择器 ===
documentfile = "1.0.1"                 # AndroidX DocumentFile

# === 图片加载（签到照片缩略图）===
coilCompose = "2.7.0"                 # Coil Compose

# === 安全加密存储（签到照片加密）===
securityCrypto = "1.1.0-alpha06"       # AndroidX Security Crypto

# === 自动更新检测依赖 ===
okhttp = "4.12.0"                      # OkHttp（GitHub API 网络请求）
gson = "2.11.0"                        # Gson（解析 GitHub Release JSON）
workRuntime = "2.10.0"                 # WorkManager（定期后台检查更新）

# === 单元测试 ===
junit = "4.13.2"                       # JUnit 4
kotlinxCoroutinesTest = "1.9.0"        # kotlinx-coroutines-test
robolectric = "4.13"                   # Robolectric（JVM 跑 Android 测试）
coreTesting = "2.2.0"                  # AndroidX Core Testing
truth = "1.4.4"                        # Google Truth 断言库


[libraries]
# === AndroidX Core ===
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

# === Compose BOM（不指定 version，由 BOM 统一管理）===
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
# Compose 各库版本由 BOM 管理，无需单独指定 version
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
# Debug 工具
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }

# === Room 数据库 ===
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-paging = { group = "androidx.room", name = "room-paging", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# === Paging 3 ===
androidx-paging-runtime-ktx = { group = "androidx.paging", name = "paging-runtime-ktx", version.ref = "paging" }
androidx-paging-compose = { group = "androidx.paging", name = "paging-compose", version.ref = "paging" }

# === 数据存储 ===
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastorePreferences" }

# === Apache POI ===
apache-poi = { group = "org.apache.poi", name = "poi", version.ref = "poi" }
apache-poi-ooxml = { group = "org.apache.poi", name = "poi-ooxml", version.ref = "poi" }

# === 文件选择器 ===
androidx-documentfile = { group = "androidx.documentfile", name = "documentfile", version.ref = "documentfile" }

# === 图片加载 ===
coil-compose = { group = "io.coil-kt", name = "coil-compose", version.ref = "coilCompose" }

# === 安全加密存储 ===
androidx-security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }

# === 自动更新检测依赖 ===
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workRuntime" }

# === 单元测试 ===
junit = { group = "junit", name = "junit", version.ref = "junit" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutinesTest" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-core-testing = { group = "androidx.arch.core", name = "core-testing", version.ref = "coreTesting" }
truth = { group = "com.google.truth", name = "truth", version.ref = "truth" }


[plugins]
# === Gradle 插件 ===
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-plugin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
