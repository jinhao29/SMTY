# Gradle JVM 参数
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AndroidX
android.useAndroidX=true

# Kotlin
kotlin.code.style=official

# 非传递型构建缓存
android.nonTransitiveRClass=true

# 网络超时设置（单位毫秒）
org.gradle.internal.http.connectionTimeout=120000
org.gradle.internal.http.socketTimeout=120000

# 禁用 Gradle 源码下载（IDE 代码导航用，非编译必需）
org.gradle.internal.ide.gradle.sources=false

# 启用构建缓存和并行构建（加速）
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# AGP 8.13 + Kotlin 2.2.10 稳定组合，无需任何 AGP 9.0 迁移开关
# - 不需要 android.builtInKotlin（AGP 8.x 没有此属性）
# - 不需要 android.newDsl（AGP 8.x 默认旧 DSL，与所有插件兼容）
# - 不需要 android.sync.suppressAgpWarnings（AGP 8.x 没有废弃警告）
