# Gradle JVM 参数
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AndroidX
android.useAndroidX=true

# Kotlin
kotlin.code.style=official

# 非传递型构建缓存
android.nonTransitiveRClass=true

# 网络超时设置（单位毫秒）
org.gradle.internal.http.connectionTimeout=120000
org.gradle.internal.http.socketTimeout=120000

# 禁用 Gradle 源码下载（IDE 代码导航用，非编译必需）
org.gradle.internal.ide.gradle.sources=false

# 启用构建缓存和并行构建（加速）
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# === AGP 9.0 兼容性配置 ===
# 压制 AGP 9.0 对旧迁移期开关的弃用警告
# （已删除所有 android.* 废弃标志，使用 AGP 9.0 新默认值）
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE

# === AGP 9.0 builtInKotlin 回退（必需，非废弃）===
# AGP 9.0 默认 builtInKotlin=true 会自动应用 Kotlin 插件，
# 与 plugins block 显式应用的 org.jetbrains.kotlin.android 冲突
# （Cannot add extension with name 'kotlin'）。
# 显式禁用 builtInKotlin，回退到传统模式：由 plugins block 显式应用 kotlin.android。
# 注意：不能同时设置 android.newDsl=false，否则会导致脚本编译失败。
android.builtInKotlin=false
