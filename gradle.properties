# Gradle JVM 参数
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AndroidX
android.useAndroidX=true

# Kotlin
kotlin.code.style=official

# 非传递型构建缓存
android.nonTransitiveRClass=true

# 网络超时设置（单位毫秒）
org.gradle.internal.http.connectionTimeout=120000
org.gradle.internal.http.socketTimeout=120000

# 禁用 Gradle 源码下载（IDE 代码导航用，非编译必需）
org.gradle.internal.ide.gradle.sources=false

# 启用构建缓存和并行构建（加速）
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# 提升大型项目依赖解析与导入性能
android.dependency.excludeLibraryComponentsFromConstraints=true

# 以下为 AGP 迁移期回退开关，当前版本删除会导致构建失败，需保留至 AGP 大版本升级后迁移
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
# AGP 9.0 默认 android.builtInKotlin=true / android.newDsl=true，旧迁移开关已弃用，移除以避免脚本编译失败

# === AGP 9.0 builtInKotlin 回退 ===
# AGP 9.0 默认 builtInKotlin=true 会自动应用 Kotlin 插件，
# 与 plugins block 显式应用的 org.jetbrains.kotlin.android 冲突
# （Cannot add extension with name 'kotlin'）。
# 显式禁用 builtInKotlin，回退到传统模式：由 plugins block 显式应用 kotlin.android。
# 注意：不能同时设置 android.newDsl=false，否则会导致脚本编译失败（Unresolved reference 'io'）。
android.builtInKotlin=false
