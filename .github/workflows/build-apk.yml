name: Build APK

# 触发条件：推送到 main 分支 或 手动触发
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 授予 gradlew 执行权限
        run: chmod +x ./gradlew

      - name: 构建 Release APK
        # 项目 build.gradle.kts 中 release 构建类型已配置 debug 签名，
        # 可直接生成可安装的 release APK（个人使用，无需正式签名）
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 获取 APK 路径
        id: apk
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Release APK 未找到，回退到 Debug APK"
            ./gradlew assembleDebug --no-daemon
            APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          fi
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "找到 APK: $APK_PATH"

      - name: 上传 APK 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: smty-apk
          path: ${{ steps.apk.outputs.apk_path }}
          retention-days: 30

      - name: 创建 Release 并上传 APK
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: v1.0.${{ github.run_number }}
          body: |
            # 自动构建版本 v1.0.${{ github.run_number }}

            由 GitHub Actions 自动构建并发布。

            **提交信息:** ${{ github.event.head_commit.message }}
            **提交时间:** ${{ github.event.head_commit.timestamp }}

            ## 安装方式
            下载下方 APK 文件，直接点击安装即可覆盖更新。
          files: ${{ steps.apk.outputs.apk_path }}
          draft: false
          prerelease: false
        env:
          # GITHUB_TOKEN 由 Actions 自动注入，兼容私有仓库
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
