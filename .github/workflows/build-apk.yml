name: Build APK

# 触发条件：推送到 main 分支 或 手动触发
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # 授予 GITHUB_TOKEN 写入权限（创建 Release 和上传资源必需）
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 授予 gradlew 执行权限
        run: chmod +x ./gradlew

      - name: 同步 versionName 与 Release tag
        # 将 app/build.gradle.kts 中的 versionName 替换为 1.0.<run_number>
        # 确保构建出的 APK 内嵌版本号与 Release tag (v1.0.<run_number>) 一致，
        # 客户端通过语义化版本比较能正确判断是否需要更新。
        run: |
          sed -i 's/versionName = ".*"/versionName = "1.0.${{ github.run_number }}"/' app/build.gradle.kts
          echo "已设置 versionName = 1.0.${{ github.run_number }}"
          grep 'versionName' app/build.gradle.kts

      - name: 替换 settings.gradle.kts 为官方源
        # CI 环境在海外，使用国内镜像反而可能导致插件版本同步延迟，
        # 直接使用官方源（google/mavenCentral/gradlePluginPortal）最稳定。
        run: |
          cat > settings.gradle.kts << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          plugins {
              id("org.gradle.toolchains.foojay-resolver-convention") version "1.0.0"
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "SportsCoach"
          include(":app")
          EOF

      - name: 替换 gradle-wrapper.properties 为官方下载源
        # CI 环境使用腾讯云镜像可能不稳定，改用官方 Gradle 发行版下载源
        run: |
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-9.5.0-all.zip
          networkTimeout=60000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

      - name: 构建 Release APK
        # 项目 build.gradle.kts 中 release 构建类型已配置 debug 签名，
        # 可直接生成可安装的 release APK（个人使用，无需正式签名）
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 获取 APK 路径
        id: apk
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Release APK 未找到，回退到 Debug APK"
            ./gradlew assembleDebug --no-daemon
            APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          fi
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT
          echo "找到 APK: $APK_PATH"

      - name: 上传 APK 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: smty-apk
          path: ${{ steps.apk.outputs.apk_path }}
          retention-days: 30

      - name: 创建 Release 并上传 APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: v1.0.${{ github.run_number }}
          body: |
            # 自动构建版本 v1.0.${{ github.run_number }}

            由 GitHub Actions 自动构建并发布。

            **提交信息:** ${{ github.event.head_commit.message }}
            **提交时间:** ${{ github.event.head_commit.timestamp }}

            ## 安装方式
            下载下方 APK 文件，直接点击安装即可覆盖更新。
          files: ${{ steps.apk.outputs.apk_path }}
          draft: false
          prerelease: false
        env:
          # GITHUB_TOKEN 由 Actions 自动注入，兼容私有仓库
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
