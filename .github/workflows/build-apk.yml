name: Build APK

# === 触发条件 ===
# 1. 推送到 main / master 分支 —— 自动构建并发布 v0.N 预览版（N = run_number）
# 2. 推送 v* 形式的 tag —— 自动构建并发布正式版（tag 名即版本号）
# 3. 手动触发 workflow_dispatch
# 限制：仅 push 到主分支才触发，避免 feature 分支频繁触发无意义 Release
on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # 授予 GITHUB_TOKEN 写入权限（创建 Release 和上传资源必需）
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        # 关闭内置 cache: gradle，改用下方显式 actions/cache@v4 做更细粒度的缓存
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 缓存 Gradle 依赖与 Wrapper 发行版
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/gradle.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 授予 gradlew 执行权限
        run: chmod +x ./gradlew

      # === 架构一/二：注入云端版本号（与 UpdateChecker 的 float 比对对齐） ===
      # VERSION_CODE = github.run_number（严格递增 1, 2, 3...）
      # VERSION_NAME = 0.<run_number>（0.1, 0.2, 0.33...）
      # Release tag 统一为 v0.<run_number>，App 端通过
      #   tagName.replace("v", "").toFloatOrNull() 解析为 0.33 与本地 versionName 比对
      - name: 注入云端版本号
        run: |
          echo "VERSION_CODE=${{ github.run_number }}" >> $GITHUB_ENV
          echo "VERSION_NAME=0.${{ github.run_number }}" >> $GITHUB_ENV

      # === 架构二/四：解密并注入 Keystore 到 app/ 目录（防签名冲突） ===
      # build.gradle.kts 的 signingConfigs 通过 app/keystore.properties 读取，
      # storeFile 默认为 app/keystore.jks（file() 相对 app 模块解析）。
      # ⚠️ 必须配置 4 个 Secrets：
      #    - KEYSTORE_BASE64：base64 编码的 .jks / .keystore 文件
      #    - KEYSTORE_PASSWORD：keystore 文件密码
      #    - KEY_ALIAS：key alias
      #    - KEY_PASSWORD：key 密码
      # 未配置时 fallback 到 debug 签名（仅本地开发，发布会导致无法覆盖安装）
      - name: 解密并注入 Keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::未配置 KEYSTORE_BASE64 Secret，将使用 debug 签名 fallback。正式发布必须配置 release 签名，否则老版本无法覆盖安装！"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/keystore.jks
          # 使用 printf 逐行写入避免 heredoc 缩进污染 properties 文件
          # storeFile=keystore.jks 相对 app 模块目录解析 = app/keystore.jks
          printf 'storeFile=keystore.jks\n' > app/keystore.properties
          printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD" >> app/keystore.properties
          printf 'keyAlias=%s\n' "$KEY_ALIAS" >> app/keystore.properties
          printf 'keyPassword=%s\n' "$KEY_PASSWORD" >> app/keystore.properties
          echo "==== keystore.properties 内容（密码已脱敏） ===="
          sed 's/=\(.\{4\}\).*/=\1***/' app/keystore.properties
          echo "==== app/keystore.jks 文件信息 ===="
          ls -la app/keystore.jks
          file app/keystore.jks

      - name: 切换 Gradle wrapper 为官方源（CI 环境）
        # CI 环境在海外，使用官方源下载 Gradle 最稳定
        run: |
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.13-all.zip
          networkTimeout=60000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          echo "已切换 Gradle wrapper 为官方源（gradle-8.13-all.zip）"

      - name: 执行 Release 打包
        # 通过 GITHUB_ENV 注入的 VERSION_CODE / VERSION_NAME 会被 build.gradle.kts 自动读取
        run: ./gradlew assembleRelease --no-daemon --stacktrace --no-configuration-cache --build-cache

      - name: 清理 Gradle 缓存中的临时文件
        if: always()
        run: |
          rm -f ~/.gradle/caches/modules-2/*.lock
          rm -f ~/.gradle/caches/modules-2/gc.properties
          rm -rf ~/.gradle/caches/transforms-3/*/locks
          rm -rf ~/.gradle/caches/journal-1
          echo "已清理 Gradle 缓存锁文件"

      - name: 上传 APK 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: smty-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      # === 架构二：自动发布 Release 并上传 APK ===
      # tag_name = v0.<run_number>，与 VERSION_NAME（0.<run_number>）一一对应
      # App 端 UpdateChecker 解析 v0.33 → 0.33，与本地 versionName 0.33 float 比对
      - name: 自动发布 Release 并上传 APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.${{ github.run_number }}
          name: v0.${{ github.run_number }}
          body: |
            # 自动构建版本 v0.${{ github.run_number }}

            由 GitHub Actions 自动构建并发布。

            **触发方式:** ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && 'Tag 推送（正式版）' || '分支推送/手动触发（预览版）' }}
            **提交信息:** ${{ github.event.head_commit.message }}
            **提交时间:** ${{ github.event.head_commit.timestamp }}
            **APK versionCode:** ${{ github.run_number }}
            **APK versionName:** 0.${{ github.run_number }}

            ## 安装方式
            下载下方 APK 文件，直接点击安装即可覆盖更新。

            ## 签名说明
            ${{ secrets.KEYSTORE_BASE64 != '' && '✅ 已使用正式 release 签名，可覆盖安装到已安装 release 版本的设备' || '⚠️ 未配置 release 签名 Secret，使用 debug 签名，无法覆盖安装到已安装 release 版本的设备' }}
          generate_release_notes: true
          files: app/build/outputs/apk/release/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
