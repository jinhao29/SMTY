name: Build APK

# === 触发条件 ===
# 1. 推送到 main / master 分支 —— 自动构建并发布 vN 预览版（N = run_number）
# 2. 推送 v* 形式的 tag —— 自动构建并发布正式版（tag 名即版本号）
# 3. 手动触发 workflow_dispatch
# 限制：仅 push 到主分支才触发，避免 feature 分支频繁触发无意义 Release
on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # 授予 GITHUB_TOKEN 写入权限（创建 Release 和上传资源必需）
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 配置 JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 授予 gradlew 执行权限
        run: chmod +x ./gradlew

      - name: 动态注入版本号
        # 通过 GITHUB_ENV 注入 VERSION_CODE 和 VERSION_NAME 环境变量
        # build.gradle.kts 中的 defaultConfig 会读取这两个变量动态生成 versionCode / versionName
        # github.run_number 在仓库维度严格递增（从 1 开始：1, 2, 3...）
        # 本地构建时环境变量不存在，使用 build.gradle.kts 中的默认值
        # （versionCode=1, versionName=1.0.0-local）
        run: |
          echo "VERSION_CODE=${{ github.run_number }}" >> $GITHUB_ENV
          echo "VERSION_NAME=1.0.${{ github.run_number }}" >> $GITHUB_ENV

      - name: 配置 Release 签名
        # 若已配置 KEYSTORE_BASE64 Secret，则解码 keystore + 写入 keystore.properties
        # build.gradle.kts 检测到 keystore.properties 时自动切换 release 签名
        # 未配置则 fallback 到 debug 签名（仅本地开发体验，不可用于正式发布）
        # ⚠️ UpdateChecker 警告：发布到 GitHub 的 APK 必须使用 release 签名
        #    必须在仓库 Settings → Secrets and variables → Actions 配置以下 4 个 Secrets：
        #    - KEYSTORE_BASE64：base64 编码的 .jks 或 .keystore 文件
        #    - KEYSTORE_PASSWORD：keystore 文件密码
        #    - KEY_ALIAS：key alias
        #    - KEY_PASSWORD：key 密码
        # 路径解析说明：
        # - keystore.jks 写入仓库根目录（$PWD = 仓库根，CI 在仓库根目录执行）
        # - keystore.properties 也写入仓库根目录
        # - build.gradle.kts 中 rootProject.file("keystore.properties") 解析到仓库根目录
        # - storeFile=../keystore.jks 在 app 模块下解析 = app/../keystore.jks = 仓库根目录/keystore.jks
        # - 显式声明 shell: bash 确保 Linux/Windows runner 都用 bash 解释器
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::未配置 KEYSTORE_BASE64 Secret，将使用 debug 签名 fallback。正式发布必须配置 release 签名，否则老版本无法覆盖安装！"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
          # 使用 printf 逐行写入避免 heredoc 缩进污染 properties 文件
          # Properties.load() 对前导空格不敏感，但显式顶格更稳健
          printf 'storeFile=../keystore.jks\n' > keystore.properties
          printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD" >> keystore.properties
          printf 'keyAlias=%s\n' "$KEY_ALIAS" >> keystore.properties
          printf 'keyPassword=%s\n' "$KEY_PASSWORD" >> keystore.properties
          echo "==== keystore.properties 内容（密码已脱敏） ===="
          sed 's/=\(.\{4\}\).*/=\1***/' keystore.properties
          echo "==== keystore.jks 文件信息 ===="
          ls -la keystore.jks
          file keystore.jks

      - name: 切换 Gradle wrapper 为官方源（CI 环境）
        # CI 环境在海外，使用官方源下载 Gradle 最稳定
        # 本地开发不受影响：gradle-wrapper.properties 在 git 中保留国内镜像加速
        run: |
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.13-all.zip
          networkTimeout=60000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          echo "已切换 Gradle wrapper 为官方源（gradle-8.13-all.zip）"

      - name: 构建 Release APK
        # 通过 GITHUB_ENV 注入的 VERSION_CODE / VERSION_NAME 会被 build.gradle.kts 自动读取
        # 无需通过 -P 参数或 sed 替换，环境变量自动生效
        # --no-configuration-cache：避免 Version Catalog + KSP 在配置缓存下的兼容性问题
        run: ./gradlew assembleRelease --no-daemon --stacktrace --no-configuration-cache

      - name: 上传 APK 构建产物
        # 保留 build artifact 便于调试和检查（与 Release 中的 APK 路径一致，无冲突）
        uses: actions/upload-artifact@v4
        with:
          name: smty-apk
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Publish to GitHub Releases
        # 使用社区标准 softprops/action-gh-release@v2 发布 APK 到 GitHub Releases
        # tag_name 使用 github.run_number 自动递增（v1, v2, v3...），每次构建生成新版本标签
        # generate_release_notes: true 让 GitHub 自动把本次提交的 Commit 记录生成到 Release 说明
        # GITHUB_TOKEN 由 Actions 自动注入，无需手动配置
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: v${{ github.run_number }}
          body: |
            # 自动构建版本 v${{ github.run_number }}

            由 GitHub Actions 自动构建并发布。

            **触发方式:** ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && 'Tag 推送（正式版）' || '分支推送/手动触发（预览版）' }}
            **提交信息:** ${{ github.event.head_commit.message }}
            **提交时间:** ${{ github.event.head_commit.timestamp }}
            **APK versionCode:** ${{ github.run_number }}
            **APK versionName:** 1.0.${{ github.run_number }}

            ## 安装方式
            下载下方 APK 文件，直接点击安装即可覆盖更新。

            ## 版本号说明
            - `vN` 系列：自动构建版本，N 为 GitHub Actions 运行编号，严格递增
            - Android 客户端会通过 versionCode 比较自动提示用户更新

            ## 签名说明
            ${{ secrets.KEYSTORE_BASE64 != '' && '✅ 已使用正式 release 签名，可覆盖安装到已安装 release 版本的设备' || '⚠️ 未配置 release 签名 Secret，使用 debug 签名，无法覆盖安装到已安装 release 版本的设备' }}
          generate_release_notes: true
          files: app/build/outputs/apk/release/app-release.apk
          draft: false
          prerelease: false
        env:
          # GITHUB_TOKEN 由 Actions 自动注入，兼容私有仓库
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
