name: Build APK

# === 触发条件（2026-09-09 版本体系修正） ===
# 1. 推送到 main / master 分支 —— 只跑单元测试 + 上传构建产物（不创建 Release）
#    避免 WIP 提交污染版本线、失败 run 留版本空洞
# 2. 推送 v* 形式的 tag —— 正式发版：校验 tag 与 version_code.txt 一致后打包发布
# 3. 手动触发 workflow_dispatch —— 等同分支推送（只测试）
#
# 版本号真源：version_code.txt（"MAJOR.MINOR.PATCH"）
#   versionCode = MAJOR*10000 + MINOR*100 + PATCH（App 端 extractRemoteVersionCode 同公式）
#   发版流程：改 version_code.txt → 提交 → 打同名 tag（v1.0.1）→ push
on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # 授予 GITHUB_TOKEN 写入权限（创建 Release 和上传资源必需）
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 缓存 Gradle 依赖与 Wrapper 发行版
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/gradle.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 授予 gradlew 执行权限
        run: chmod +x ./gradlew

      # === 版本号：从 version_code.txt 计算并注入 ===
      # - VERSION_NAME = 文件内容（SemVer）
      # - VERSION_CODE = MAJOR*10000 + MINOR*100 + PATCH
      # - tag 推送时必须满足 tag == "v<文件内容>"，否则直接失败（防版本错乱）
      - name: 解析版本号并校验 tag 一致性
        run: |
          VER=$(tr -d ' \r\n' < version_code.txt)
          if ! [[ "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version_code.txt 内容非法：'$VER'（应为 MAJOR.MINOR.PATCH）"
            exit 1
          fi
          MAJOR=$(echo "$VER" | cut -d. -f1)
          MINOR=$(echo "$VER" | cut -d. -f2)
          PATCH=$(echo "$VER" | cut -d. -f3)
          CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            if [ "v$VER" != "$TAG" ]; then
              echo "::error::tag ($TAG) 与 version_code.txt (v$VER) 不一致！请先修改 version_code.txt 并提交，再打同名 tag"
              exit 1
            fi
          fi
          echo "版本：$VER（versionCode=$CODE）"
          echo "VERSION_NAME=$VER" >> $GITHUB_ENV
          echo "VERSION_CODE=$CODE" >> $GITHUB_ENV
          echo "IS_RELEASE=$([[ "$GITHUB_REF" == refs/tags/v* ]] && echo true || echo false)" >> $GITHUB_ENV

      # === 解密并注入 Keystore 到 app/ 目录（防签名冲突） ===
      # build.gradle.kts 的 signingConfigs 通过 app/keystore.properties 读取，
      # storeFile 默认为 app/keystore.jks（file() 相对 app 模块解析）。
      # ⚠️ 必须配置 4 个 Secrets：KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD
      # 未配置时 fallback 到 debug 签名（仅本地开发，发布会导致无法覆盖安装）
      - name: 解密并注入 Keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::未配置 KEYSTORE_BASE64 Secret，将使用 debug 签名 fallback。正式发布必须配置 release 签名，否则老版本无法覆盖安装！"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/keystore.jks
          printf 'storeFile=keystore.jks\n' > app/keystore.properties
          printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD" >> app/keystore.properties
          printf 'keyAlias=%s\n' "$KEY_ALIAS" >> app/keystore.properties
          printf 'keyPassword=%s\n' "$KEY_PASSWORD" >> app/keystore.properties
          echo "==== app/keystore.jks 文件信息 ===="
          ls -la app/keystore.jks
          file app/keystore.jks

      - name: 切换 Gradle wrapper 为官方源（CI 环境）
        run: |
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.13-all.zip
          networkTimeout=60000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF
          echo "已切换 Gradle wrapper 为官方源（gradle-8.13-all.zip）"

      - name: 执行单元测试
        # 发布前先跑全部单元测试，防止算法回归（版本比对/消课/身高预测等）流入 Release
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace --no-configuration-cache

      - name: 执行 Release 打包
        # 仅 tag 推送才打包 Release；分支推送只验证测试，不产出可安装包
        if: env.IS_RELEASE == 'true'
        run: ./gradlew assembleRelease --no-daemon --stacktrace --no-configuration-cache --build-cache

      - name: 清理 Gradle 缓存中的临时文件
        if: always()
        run: |
          rm -f ~/.gradle/caches/modules-2/*.lock
          rm -f ~/.gradle/caches/modules-2/gc.properties
          rm -rf ~/.gradle/caches/transforms-3/*/locks
          rm -rf ~/.gradle/caches/journal-1
          echo "已清理 Gradle 缓存锁文件"

      - name: 上传 APK 构建产物
        if: env.IS_RELEASE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: smty-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      # === 正式发布：tag_name = 推送的 tag 本身（vMAJOR.MINOR.PATCH），与 APK 版本一致 ===
      - name: 自动发布 Release 并上传 APK
        if: env.IS_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            # 正式版本 ${{ github.ref_name }}

            由 GitHub Actions 自动构建并发布（tag 与 version_code.txt 校验一致）。

            **提交信息:** ${{ github.event.head_commit.message }}
            **APK versionCode:** ${{ env.VERSION_CODE }}
            **APK versionName:** ${{ env.VERSION_NAME }}

            ## 安装方式
            下载 universal APK 文件，直接点击安装即可覆盖更新。

            ## 签名说明
            ${{ secrets.KEYSTORE_BASE64 != '' && '✅ 已使用正式 release 签名，可覆盖安装到已安装 release 版本的设备' || '⚠️ 未配置 release 签名 Secret，使用 debug 签名，无法覆盖安装到已安装 release 版本的设备' }}
          generate_release_notes: true
          files: app/build/outputs/apk/release/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
